<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Project</title>
  <!-- Link your CSS file -->
  <style>
   .bigbx {
  background-color: rgb(215, 215, 215);
  padding: 2rem;
  width: 100%;
  height: 25rem;
  max-width: 400px; 
  margin: 0 auto;   
  border-radius: 10px;
  margin-top: 20rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
#progress {
  margin-top: 5rem;
}
img{
 
}
.smallbx{
  margin-left: 0 auto;
  margin-right: 0 auto;

}

  </style>
</head>
<body>
    <div class="bigbx">
      <div class="smallbx">
            <img src="./img1.jpeg">
        </div>
        <h1>Melody</h1>
        <audio id="audio-player">
          <source src="bensound-acousticbreeze.mp3" type ="audio/mp3">
        </audio>
      <div class="controls">
        <button class="prev">⏮️</button>
          <button class="play">▶️</button>
         <span class="current-time">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100">
          <span class="duration">0:00</span>
          <button class="shuffle">🔀</button>
          <button class="next">⏭️</button>
      </div>
   </div>
        
    </div>
  <!-- Link your JavaScript file -->

  <script>
    const imglist=["img1.jpeg", "img2.jpeg","img3.jpeg","img4.jpeg","img5.jpeg"]
    const audioList =["bensound-acousticbreeze.mp3", "bensound-creativeminds.mp3", "bensound-epic.mp3", "bensound-littleidea.mp3", "bensound-sunny.mp3"]
    const titlen=["Melody", "Vibe", "Chill", "Boom", "Breeze"]
    let randomNum = Math.floor(Math.random()*5);
   
    

    document.querySelector(".shuffle").addEventListener("click", function(event){
      let container = document.querySelector("audio");
      randomNum = Math.floor(Math.random()*5);
      container.innerHTML = "";
      container.insertAdjacentHTML("beforeend", `<source src=${audioList[randomNum]} type ="audio/mp3">`);
      container.load();
      container.play();
      document.querySelector("h1").textContent=titlen[randomNum];
      document.querySelector("img").src = `./img${randomNum+1}.jpeg`
      
    });
    document.querySelector(".play").addEventListener("click", function(event){
      if(document.querySelector("audio").paused){
        document.querySelector("audio").play();
        document.querySelector(".play").textContent = '▶️';
      }
      else{
        document.querySelector("audio").pause();
        document.querySelector(".play").textContent = '⏸️';

      }
    });
    document.querySelector(".next").addEventListener("click", function(event){
      let container = document.querySelector("audio");
      randomNum = (randomNum + 1)% audioList.length;
      container.innerHTML = "";
      container.insertAdjacentHTML("beforeend", `<source src=${audioList[randomNum]} type ="audio/mp3">`);
      container.load();
      container.play();
      document.querySelector("img").src = `./img${randomNum+1}.jpeg`
      document.querySelector("h1").textContent=titlen[randomNum];
    });
    document.querySelector(".prev").addEventListener("click", function(event){
      let container = document.querySelector("audio");
      randomNum = (randomNum - 1)%audioList.length;
      container.innerHTML = "";
      container.insertAdjacentHTML("beforeend", `<source src=${audioList[randomNum]} type ="audio/mp3">`);
      container.load();
      container.play();
      document.querySelector("img").src = `./img${randomNum+1}.jpeg`
      document.querySelector("h1").textContent=titlen[randomNum];
      
    });


const audio = document.getElementById('audio-player');
const progress = document.getElementById('progress');
const currentTimeEl = document.querySelector('.current-time');
const durationEl = document.querySelector('.duration');

// Update duration when metadata loads
audio.addEventListener('loadedmetadata', () => {
  durationEl.textContent = formatTime(audio.duration);
});

// Update progress bar as audio plays
audio.addEventListener('timeupdate', () => {
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.value = percent;
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

// Seek when user drags the bar
progress.addEventListener('input', () => {
  const seekTime = (progress.value / 100) * audio.duration;
  audio.currentTime = seekTime;
});

// Format seconds to M:SS
function formatTime(time) {
  const mins = Math.floor(time / 60);
  const secs = Math.floor(time % 60).toString().padStart(2, '0');
  return `${mins}:${secs}`;
}
  </script>
</body>
</html>
